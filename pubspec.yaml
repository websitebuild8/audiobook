name: maktaba_athariyya
description: A fast, fully offline Dhivehi and Arabic book and audiobook reader.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  pdfrx: ^2.4.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/branding/
    - covers/
    - books/Dar Al Fitya/
    - books/Markaz Al Meezan/
    - books/Markaz Al fursan/
    - books/Other/
    - audios/Markaz Al Fursan/hukum masala rujoo'a vaa aslu/
    - audios/other/Muzani/
  fonts:
    - family: Faseyha
      fonts:
        - asset: fonts/Faseyha_reg_hinted_v2.ttf
