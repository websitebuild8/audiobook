name: maktaba_athariyya
description: A fast, fully offline Dhivehi and Arabic book and audiobook reader.
publish_to: none
version: 1.0.0+7

environment:
  flutter: ">=3.41.0"
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  path_provider: ^2.1.6
  pdfrx: ^2.4.7
  shared_preferences: ^2.5.3
  background_downloader: ^9.6.2
  liquid_glass_widgets: ^1.7.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Faseyha
      fonts:
        - asset: fonts/Faseyha_reg_hinted_v2.ttf
    - family: Maumoon
      fonts:
        - asset: fonts/Maumoon.otf
